<!-- ngSkipHydration em cada tela: Angular não deve tentar reconciliar o DOM
     pré-renderizado (SSR) contra o estado real de autenticação (que só existe no
     cliente, via localStorage) -- mesmo motivo já documentado para <app-pai>. -->
<app-login-senha
  *ngIf="tela === 'login'"
  ngSkipHydration
  [mensagemInicial]="mensagemLogin"
  (autenticado)="aoAutenticar()"
  (irParaPrimeiroAcesso)="irParaPrimeiroAcesso()">
</app-login-senha>

<app-primeiro-acesso
  *ngIf="tela === 'primeiro-acesso'"
  ngSkipHydration
  (autenticado)="aoAutenticar()"
  (voltarParaLogin)="irParaLogin()">
</app-primeiro-acesso>

<app-pai
  *ngIf="tela === 'dashboard'"
  ngSkipHydration
  (sair)="sair()">
</app-pai>

<app-admin-perfis
  *ngIf="tela === 'admin-perfis'"
  ngSkipHydration
  (sair)="sair()">
</app-admin-perfis>
