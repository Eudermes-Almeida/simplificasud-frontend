<div class="my-3">

  <!-- Título Interno -->
  <h5 class="text-uppercase mb-3 fw-bold text-secondary small px-1 tracking-wide">
    Prioridades Proféticas
  </h5>

  <div class="d-flex align-items-center gap-2 text-muted my-3" *ngIf="carregando">
    <div class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></div>
    <span>Carregando dados de prioridades proféticas...</span>
  </div>

  <div class="alert alert-danger my-3" role="alert" *ngIf="erroCarregamento">
    {{ erroCarregamento }}
  </div>

  <!-- Áreas: VIVER / CUIDAR / CONVIDAR / UNIR -->
  <div class="rx-area-bloco" *ngFor="let area of areas">
    <div class="rx-area-header">
      <span class="rx-area-nome">{{ area.area }}</span>
      <span class="rx-area-subtitulo">{{ area.subtitulo }}</span>
    </div>

    <div class="rx-progresso-grid">
      <div class="rx-progresso-card" *ngFor="let item of area.itens">
        <div class="rx-progresso-topo">
          <span class="rx-progresso-icon">
            <i class="bi" [ngClass]="item.icone"></i>
          </span>
          <span class="rx-progresso-nome">{{ item.nome }}</span>
        </div>

        <div class="rx-progresso-linhas">
          <div class="rx-progresso-linha">
            <span class="rx-progresso-label">Atual:</span>
            <span class="rx-progresso-num">{{ item.atual }}</span>
          </div>
          <div class="rx-progresso-linha">
            <span class="rx-progresso-label">Meta:</span>
            <span class="rx-progresso-num">{{ item.meta }}</span>
          </div>
          <div class="rx-progresso-linha">
            <span class="rx-progresso-label">Falta:</span>
            <span class="rx-progresso-num" [ngClass]="faltaClasse(item)">{{ faltam(item) }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
