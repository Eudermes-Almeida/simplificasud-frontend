<header class="raiox-hero">
  <div class="raiox-hero-content">
    <button type="button" class="raiox-sair-btn" (click)="sair.emit()">
      <i class="bi bi-box-arrow-right"></i> Sair
    </button>
    <img src="assets/logo-simplifica-sud.jpg" alt="Simplifica Sud" class="raiox-hero-logo" />
    <h5>Estaca Betim</h5>
    <p class="raiox-hero-subtitle">Acompanhe, em um só lugar, os indicadores essenciais da unidade</p>
    <p class="raiox-hero-usuario" *ngIf="nomeLogado">Olá, {{ nomeLogado }}</p>
  </div>
</header>

<main class="container raiox-container">

   <!-- 🔽 SELEÇÃO DE UNIDADE (só aparece se o líder puder ver mais de 1 unidade) 🔽 -->
  <div class="row justify-content-center mb-4" *ngIf="unidades.length > 1">
    <div class="col-12 col-sm-8 col-md-6 col-lg-5">
      <div class="raiox-unit-picker">
        <label for="selectUnidade" class="raiox-unit-label">
          Selecione a Unidade para visualizar os dados
        </label>
        <div class="raiox-unit-field">
          <span class="raiox-unit-icon"><i class="fa-solid fa-church"></i></span>
          <ng-select
            id="selectUnidade"
            class="raiox-unit-select"
            [items]="unidades"
            bindLabel="label"
            bindValue="value"
            [clearable]="false"
            [searchable]="false"
            [(ngModel)]="unidadeSelecionada"
            aria-label="Seleção de Unidade">
          </ng-select>
        </div>
      </div>
    </div>
  </div>
  <div class="row justify-content-center mb-4" *ngIf="unidades.length === 1">
    <div class="col-12 text-center raiox-unit-fixa">
      Exibindo dados de: <strong>{{ unidadeSelecionadaLabel }}</strong>
    </div>
  </div>
  <!-- 🔼 FIM DA SELEÇÃO DE UNIDADE 🔼 -->

  <div ngbAccordion [closeOthers]="true" class="raiox-accordion">

    <!-- ITEM 1: Frequência Sacramental -->
    <div ngbAccordionItem="itemUm" [collapsed]="true" class="raiox-card">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton class="raiox-toggle">
          <span class="raiox-icon"><i class="bi bi-people-fill"></i></span>
          <span class="raiox-label">Frequência Sacramental {{ unidadeSelecionadaLabel }}</span>
          <span class="raiox-chevron"><i class="bi bi-chevron-down"></i></span>
        </button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody class="raiox-body">
          <ng-template>
            <app-frequencia-sacramental [unidade]="unidadeSelecionadaLabel"></app-frequencia-sacramental>
          </ng-template>
        </div>
      </div>
    </div>

    <!-- ITEM 2: Recém Conversos -->
    <div ngbAccordionItem="itemDois" class="raiox-card">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton class="raiox-toggle">
          <span class="raiox-icon"><i class="bi bi-person-plus-fill"></i></span>
          <span class="raiox-label">Recém Conversos {{ unidadeSelecionadaLabel }}</span>
          <span class="raiox-chevron"><i class="bi bi-chevron-down"></i></span>
        </button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody class="raiox-body">
          <ng-template>
            <app-recem-conversos [unidade]="unidadeSelecionadaLabel"></app-recem-conversos>
          </ng-template>
        </div>
      </div>
    </div>

    <!-- ITEM: Homens Adultos Recém-Conversos -->
    <div ngbAccordionItem="itemSeis" class="raiox-card">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton class="raiox-toggle">
          <span class="raiox-icon"><i class="bi bi-person-arms-up"></i></span>
          <span class="raiox-label">Homens Adultos Recém-Conversos {{ unidadeSelecionadaLabel }}</span>
          <span class="raiox-chevron"><i class="bi bi-chevron-down"></i></span>
        </button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody class="raiox-body">
          <ng-template>
            <app-homens-avancando-sacerdocio [unidade]="unidadeSelecionadaLabel"></app-homens-avancando-sacerdocio>
          </ng-template>
        </div>
      </div>
    </div>

    <!-- ITEM 3: Jovens e Crianças -->
    <div ngbAccordionItem="itemTres" class="raiox-card">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton class="raiox-toggle">
          <span class="raiox-icon"><i class="bi bi-emoji-smile-fill"></i></span>
          <span class="raiox-label">Jovens e Crianças {{ unidadeSelecionadaLabel }}</span>
          <span class="raiox-chevron"><i class="bi bi-chevron-down"></i></span>
        </button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody class="raiox-body">
          <ng-template>
            <app-jovens-criancas [unidade]="unidadeSelecionadaLabel"></app-jovens-criancas>
          </ng-template>
        </div>
      </div>
    </div>

    <!-- ITEM 4: Seminário -->
    <div ngbAccordionItem="itemQuatro" class="raiox-card">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton class="raiox-toggle">
          <span class="raiox-icon"><i class="bi bi-book-half"></i></span>
          <span class="raiox-label">Seminário {{ unidadeSelecionadaLabel }}</span>
          <span class="raiox-chevron"><i class="bi bi-chevron-down"></i></span>
        </button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody class="raiox-body">
          <ng-template>
            <app-seminario [unidade]="unidadeSelecionadaLabel"></app-seminario>
          </ng-template>
        </div>
      </div>
    </div>

    <!-- ITEM 5: Missionários Retornados -->
    <div ngbAccordionItem="itemNove" class="raiox-card">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton class="raiox-toggle">
          <span class="raiox-icon"><i class="bi bi-airplane-fill"></i></span>
          <span class="raiox-label">Missionários Retornados {{ unidadeSelecionadaLabel }}</span>
          <span class="raiox-chevron"><i class="bi bi-chevron-down"></i></span>
        </button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody class="raiox-body">
          <ng-template>
            <app-missionarios-retornados [unidade]="unidadeSelecionadaLabel"></app-missionarios-retornados>
          </ng-template>
        </div>
      </div>
    </div>

    <!-- ITEM: Missionários na Ativa -->
    <div ngbAccordionItem="itemOnze" class="raiox-card">

        <button ngbAccordionButton class="raiox-toggle">
          <span class="raiox-icon"><i class="bi bi-person-video3"></i></span>
          <span class="raiox-label">Missionários na Ativa {{ unidadeSelecionadaLabel }}</span>
          <span class="raiox-chevron"><i class="bi bi-chevron-down"></i></span>
        </button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody class="raiox-body">
          <ng-template>
            <app-missionarios-na-ativa [unidade]="unidadeSelecionadaLabel"></app-missionarios-na-ativa>
          </ng-template>
        </div>
      </div>
    </div>

    <!-- ITEM 6: Membros Adultos Solteiros -->
    <div ngbAccordionItem="itemDez" class="raiox-card">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton class="raiox-toggle">
          <span class="raiox-icon"><i class="bi bi-person-badge-fill"></i></span>
          <span class="raiox-label">Membros Adultos Solteiros {{ unidadeSelecionadaLabel }}</span>
          <span class="raiox-chevron"><i class="bi bi-chevron-down"></i></span>
        </button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody class="raiox-body">
          <ng-template>
            <app-membros-adultos-solteiros [unidade]="unidadeSelecionadaLabel"></app-membros-adultos-solteiros>
          </ng-template>
        </div>
      </div>
    </div>

    <!-- ITEM 8: Qualificação da Unidade -->
    <div ngbAccordionItem="itemCinco" class="raiox-card">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton class="raiox-toggle">
          <span class="raiox-icon"><i class="bi bi-patch-check-fill"></i></span>
          <span class="raiox-label">Qualificação da Unidade {{ unidadeSelecionadaLabel }}</span>
          <span class="raiox-chevron"><i class="bi bi-chevron-down"></i></span>
        </button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody class="raiox-body">
          <ng-template>
            <app-qualificacao-unidade [unidade]="unidadeSelecionadaLabel"></app-qualificacao-unidade>
          </ng-template>
        </div>
      </div>
    </div>

    <!-- Reuniões, Atividades e Lançamentos (temporariamente desativado)
    <div ngbAccordionItem="itemSete" class="raiox-card">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton class="raiox-toggle">
          <span class="raiox-icon"><i class="bi bi-calendar2-event-fill"></i></span>
          <span class="raiox-label">Reuniões, Atividades e Lançamentos {{ unidadeSelecionadaLabel }}</span>
          <span class="raiox-chevron"><i class="bi bi-chevron-down"></i></span>
        </button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody class="raiox-body">
          <ng-template>
            <app-reunioes-atividades-lancamentos></app-reunioes-atividades-lancamentos>
          </ng-template>
        </div>
      </div>
    </div>
    -->

    <!-- ITEM 9: Prioridades Proféticas ** -->
    <div ngbAccordionItem="itemOito" class="raiox-card">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton class="raiox-toggle">
          <span class="raiox-icon"><i class="bi bi-compass-fill"></i></span>
          <span class="raiox-label">Prioridades Proféticas {{ unidadeSelecionadaLabel }}</span>
          <span class="raiox-chevron"><i class="bi bi-chevron-down"></i></span>
        </button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody class="raiox-body">
          <ng-template>
            <app-prioridades-profeticas [unidade]="unidadeSelecionadaLabel"></app-prioridades-profeticas>
          </ng-template>
        </div>
      </div>
    </div>

    <div>
      <app-rodape></app-rodape>
    </div>

  </div>
</main>
