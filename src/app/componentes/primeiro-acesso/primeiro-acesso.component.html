<div class="rx-auth-tela">
  <header class="rx-auth-hero">
    <span class="rx-auth-badge"><i class="bi bi-person-badge-fill"></i></span>
    <h1 class="rx-auth-title">Primeiro Acesso</h1>
    <p class="rx-auth-subtitle">Estaca Betim</p>
  </header>

  <!-- ETAPA 1: identificação -->
  <div class="rx-auth-card" *ngIf="etapa === 'identificacao'">
    <h2 class="rx-auth-card-titulo">Quem é você?</h2>
    <p class="rx-auth-card-texto">Informe sua data de nascimento e os últimos 4 caracteres do seu registro de membro.</p>

    <div class="rx-auth-campo">
      <label for="nascimentoInput">Data de nascimento</label>
      <input
        id="nascimentoInput"
        type="text"
        inputmode="numeric"
        maxlength="8"
        [(ngModel)]="nascimento"
        [disabled]="carregando"
        placeholder="DDMMAAAA" />
      <small>Somente números, sem barra. Exemplo: 19101996</small>
    </div>

    <div class="rx-auth-campo">
      <label for="registroInput">Últimos 4 caracteres do registro de membro</label>
      <input
        id="registroInput"
        type="text"
        maxlength="4"
        [(ngModel)]="ultimosQuatroRegistro"
        (keyup.enter)="identificar()"
        [disabled]="carregando"
        placeholder="Ex: 3742" />
    </div>

    <p class="rx-auth-erro" *ngIf="erro">{{ erro }}</p>

    <button type="button" class="rx-auth-btn" [disabled]="carregando" (click)="identificar()">
      {{ carregando ? 'Verificando...' : 'Continuar' }}
    </button>

    <button type="button" class="rx-auth-link" (click)="voltarParaLogin.emit()">
      Já tem login? Voltar para a tela de entrar
    </button>
  </div>

  <!-- ETAPA 2: confirmação de identidade -->
  <div class="rx-auth-card" *ngIf="etapa === 'confirmacao'">
    <h2 class="rx-auth-card-titulo">Confirme sua identidade</h2>

    <p class="rx-auth-nome-confirmacao">Você é {{ liderNome }}?</p>

    <div class="rx-auth-linha-botoes">
      <button type="button" class="rx-auth-btn" (click)="confirmarIdentidade()">Sim, sou eu</button>
      <button type="button" class="rx-auth-btn rx-auth-btn-secundario" (click)="negarIdentidade()">Não</button>
    </div>
  </div>

  <!-- ETAPA 3: cadastro de login/senha -->
  <div class="rx-auth-card" *ngIf="etapa === 'cadastro'">
    <h2 class="rx-auth-card-titulo">Crie seu login e senha</h2>

    <div class="rx-auth-campo">
      <label for="novoLoginInput">Login</label>
      <input
        id="novoLoginInput"
        type="text"
        [(ngModel)]="login"
        [disabled]="carregando"
        autocomplete="username"
        placeholder="Escolha um login" />
    </div>

    <div class="rx-auth-campo">
      <label for="novaSenhaInput">Senha</label>
      <input
        id="novaSenhaInput"
        type="password"
        [(ngModel)]="senha"
        [disabled]="carregando"
        autocomplete="new-password"
        placeholder="Pelo menos 4 caracteres" />
    </div>

    <div class="rx-auth-campo">
      <label for="confirmarSenhaInput">Confirme a senha</label>
      <input
        id="confirmarSenhaInput"
        type="password"
        [(ngModel)]="confirmarSenha"
        (keyup.enter)="cadastrar()"
        [disabled]="carregando"
        autocomplete="new-password"
        placeholder="Digite a senha novamente" />
    </div>

    <p class="rx-auth-erro" *ngIf="erro">{{ erro }}</p>

    <button type="button" class="rx-auth-btn" [disabled]="carregando" (click)="cadastrar()">
      {{ carregando ? 'Salvando...' : 'Concluir cadastro' }}
    </button>
  </div>
</div>
